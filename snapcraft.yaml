name: rare
base: core24
version: '1.12.0.237'
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
summary: Open source alternative for Epic Games Launcher, using Legendary
description: |
 Rare is a frontend for legendary-gl, an open source alternative for the Epic Games Launcher.

  Why Rare?

      Tries to be as lightweight as we can make it while still offering a feature-full experience
      Supports all major platforms (Windows, Linux, Mac)
      Gets out of your way when you don't need it, allowing you to enjoy your games

  Rare supports all core features from the Epic Games Launcher, like installing and launching games, also many options to launch games with compatibility tools.
grade: stable
confinement: strict
icon: Rare.svg

apps:
  rare:
    command-chain: [override-paths, winehq-stable-variables]
    command: Rare-1.12.0.237-x86_64-linux/Rare.bin
    desktop: rare.desktop
    common-id: io.github.dummerle.rare
    environment:
      HOME: $SNAP_USER_COMMON
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
    extensions: [kde-neon-6]
    plugs:
      - network-status
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - system-observe
      - hardware-observe
      - upower-observe
  dot-local-share-applications:
    command-chain: [override-paths]
    command: usr/bin/leyline-weaver --kdialog --noconfirm
    environment:
      HOME: $SNAP_USER_COMMON
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
      LEYLINE_DEST: $SNAP_USER_COMMON/.local/share
    extensions: [kde-neon-6]

plugs:
  shared-memory:
    private: true
  winehq-stable:
    content: winehq-stable
    interface: content
    target: $SNAP/winehq-stable
    default-provider: wine-kyu

layout:
  /usr/lib/i386-linux-gnu/alsa-lib:
    symlink: $SNAP/winehq-stable/usr/lib/i386-linux-gnu/alsa-lib
  /usr/lib/x86_64-linux-gnu/alsa-lib:
    symlink: $SNAP/winehq-stable/usr/lib/x86_64-linux-gnu/alsa-lib
  /usr/lib/mangohud:
    symlink: $SNAP/winehq-stable/usr/lib/mangohud

parts:
  rare-app:
    plugin: dump
    source: https://github.com/RareDevs/Rare/releases/download/1.12.0.237/Rare-1.12.0.237-x86_64-linux.zip
    build-packages: [curl]
    override-build: |
      craftctl default
      curl -o $CRAFT_PART_INSTALL/rare.desktop https://raw.githubusercontent.com/RareDevs/Rare/07bfcea4c2d439271f744df110a6d3648a4647fc/packaging/rare.desktop
      sed -i 's|Name=Rare|Name=Rare [Kyu]|' $CRAFT_PART_INSTALL/rare.desktop

  leyline-weaver:
    after: [rare-app]
    plugin: dump
    source: https://github.com/Kyuyrii/Leyline-Weaver.git
    stage-packages:
      - python3-jeepney
    organize:
      leyline-weaver: usr/bin/leyline-weaver
      LICENSE: meta/LICENSE-Leyline-Weaver
    prime:
      - usr/bin/leyline-weaver
      - meta/LICENSE-Leyline-Weaver
      - usr/lib/python3/dist-packages
  
  kdialog:
    after: [leyline-weaver]
    plugin: nil
    stage-snaps: [kdialog]

  other-files:
    after: [kdialog]
    plugin: dump
    source: ./other-files
