name: rare
base: core26
version: '1.12.0.237'
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
summary: Open source alternative for Epic Games Launcher, using Legendary
description: |
 Rare is a frontend for legendary-gl, an open source alternative for the Epic Games Launcher.

  Why Rare?

      Tries to be as lightweight as we can make it while still offering a feature-full experience
      Supports all major platforms (Windows, Linux, Mac)
      Gets out of your way when you don't need it, allowing you to enjoy your games

  Rare supports all core features from the Epic Games Launcher, like installing and launching games, also many options to launch games with compatibility tools.
grade: stable
confinement: strict
icon: Rare.svg

apps:
  rare:
    command-chain: [define-variables]
    command: bin/rare
    desktop: rare.desktop
    common-id: io.github.dummerle.rare
    environment:
      HOME: $SNAP_USER_COMMON
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/lib/python3/dist-packages:$PYTHONPATH
      BWRAP: $SNAP/bin/bwrap
      PRESSURE_VESSEL_BWRAP: $SNAP/bin/bwrap
      PROTONFIXES_DISABLE: "1"
    extensions: [kde-neon-6]
    plugs:
      - network-status
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - system-observe
      - hardware-observe
      - upower-observe
      - umu-support
  dot-local-share-applications:
    command-chain: [define-variables]
    command: usr/bin/leyline-weaver --terminal --noconfirm
    environment:
      HOME: $SNAP_USER_COMMON
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/lib/python3/dist-packages:$PYTHONPATH
      LEYLINE_DEST: $SNAP_USER_COMMON/.local/share
    extensions: [kde-neon-6]

plugs:
  shared-memory:
    private: true
  winehq-stable:
    content: winehq-stable
    interface: content
    target: $SNAP/winehq-stable
    default-provider: winehq-stable

layout:
  /usr/share/alsa:
    symlink: $SNAP/winehq-stable/usr/share/alsa
  /usr/lib/x86_64-linux-gnu/alsa-lib:
    symlink: $SNAP/winehq-stable/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/lib/mangohud:
    symlink: $SNAP/usr/lib/mangohud

lint:
  ignore:
    - library:
        - usr/lib/mangohud/lib32/**

parts:
  rare-app:
    plugin: python
    source: https://github.com/RareDevs/Rare.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - git
      - python3-pip
      - pyside6-tools
      - curl
    override-build: |
      export DEB_PYTHON_INSTALL_LAYOUT=deb_system
      sed -i '/PySide6-Essentials/d' pyproject.toml
      pip install --break-system-packages --prefix="$CRAFT_PART_INSTALL" .
      bash tools/ui2py.sh --force
      bash tools/qrc2py.sh --force
      python3 tools/ts2qm.py
      pip install --break-system-packages --no-deps --force-reinstall --prefix="$CRAFT_PART_INSTALL" .
      sed -i '1s|^#!/usr/bin/python3.*|#!/usr/bin/env python3|' "$CRAFT_PART_INSTALL"/bin/*
      curl -o $CRAFT_PART_INSTALL/rare.desktop https://raw.githubusercontent.com/RareDevs/Rare/refs/heads/main/packaging/rare.desktop

  leyline-weaver:
    after: [rare-app]
    plugin: dump
    source: https://github.com/Kyuyrii/Leyline-Weaver.git
    stage-packages:
      - python3-jeepney
    organize:
      leyline-weaver: usr/bin/leyline-weaver
      LICENSE: meta/LICENSE-Leyline-Weaver
    prime:
      - usr/bin/leyline-weaver
      - meta/LICENSE-Leyline-Weaver
      - usr/lib/python3/dist-packages

  proot-next:
    after: [leyline-weaver]
    plugin: nil
    build-packages: [curl]
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      curl -fsSL -o "$CRAFT_PART_INSTALL/bin/proot" \
        "https://github.com/selkies-project/proot-next/releases/download/0.3.9/proot-$(uname -m)"
      chmod +x "$CRAFT_PART_INSTALL/bin/proot"
      ln -sf proot "$CRAFT_PART_INSTALL/bin/bwrap"

  mangohud:
    after: [proot-next]
    plugin: dump
    source: https://github.com/flightlessmango/MangoHud/releases/download/v0.8.4/MangoHud-0.8.4.r0.g992103e.tar.gz
    override-build: |
      craftctl default
      tar -xvf MangoHud-package.tar -C $CRAFT_PART_INSTALL
      sed -i 's|MANGOHUD_LIB_NAME="/usr/lib/mangohud/\\$LIB/libMangoHud_shim.so"|MANGOHUD_LIB_NAME="/usr/lib/mangohud/lib64/libMangoHud_shim.so"|' $CRAFT_PART_INSTALL/usr/bin/mangohud
    prime:
      - usr/bin
      - usr/lib/mangohud
      - usr/share

  other-files:
    after: [leyline-weaver]
    plugin: dump
    source: ./other-files
